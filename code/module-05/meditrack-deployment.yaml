# MediTrack sur kind — deployment AVEC annotations d'injection (demo 5.2 / TP 5)
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: meditrack-sa
  namespace: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meditrack-api
  namespace: demo
  labels:
    app: meditrack-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meditrack-api
  template:
    metadata:
      labels:
        app: meditrack-api
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "meditrack"
        vault.hashicorp.com/agent-inject-secret-app.env: "secret/data/meditrack/api"
        vault.hashicorp.com/agent-inject-template-app.env: |
          {{ with secret "secret/data/meditrack/api" -}}
          DB_USER={{ .Data.data.db_user }}
          DB_PASSWORD={{ .Data.data.db_password }}
          {{- end }}
    spec:
      serviceAccountName: meditrack-sa
      containers:
        - name: app
          image: alpine:3.20
          command: ["sleep", "infinity"]
